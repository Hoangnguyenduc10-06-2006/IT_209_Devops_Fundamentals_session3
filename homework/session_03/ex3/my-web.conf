################################################################################
# Nginx Server Block - Cấu hình HTTP Basic Authentication cho Thư mục /admin
# Bài tập: Session 03 - Exercise 3: DevOps Fundamentals
# Đường dẫn trên Server: /etc/nginx/sites-available/my-web
# Đường dẫn Symlink:     /etc/nginx/sites-enabled/my-web
################################################################################

server {
    listen       80;
    listen       [::]:80;

    server_name  _;

    # Thư mục web root chính
    root  /var/www/my-web/html;
    index index.html index.htm;

    # Nhật ký truy cập và lỗi
    access_log  /var/log/nginx/my-web.access.log;
    error_log   /var/log/nginx/my-web.error.log;

    # --------------------------------------------------------------------------
    # Location chính: Phục vụ các trang tĩnh công khai
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # --------------------------------------------------------------------------
    # BÀI TẬP 3: Bảo vệ khu vực nhạy cảm /admin bằng HTTP Basic Authentication
    # --------------------------------------------------------------------------
    location /admin {
        # Thông điệp thông báo trong hộp thoại đăng nhập (Realm name)
        auth_basic "Restricted Admin Area";

        # Đường dẫn tuyệt đối đến tệp mật khẩu băm .htpasswd
        # LƯU Ý BẢO MẬT: Đặt tại /etc/nginx/ bên ngoài web root (/var/www/)
        # để ngăn chặn việc người dùng internet tải trực tiếp file mật khẩu.
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Phục vụ file tĩnh trong /var/www/my-web/html/admin/ sau khi xác thực thành công
        try_files $uri $uri/ =404;
    }

    # --------------------------------------------------------------------------
    # BÀI TẬP 2: Trang lỗi 404 tùy biến được bảo vệ bằng chỉ thị internal
    # --------------------------------------------------------------------------
    error_page 404 /404.html;

    location = /404.html {
        root     /var/www/my-web/html;
        internal;
    }
}
