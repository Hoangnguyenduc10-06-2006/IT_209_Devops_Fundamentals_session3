################################################################################
# Nginx Server Block - Cấu hình Trang Lỗi 404 Tùy Chỉnh (Custom 404 Error Page)
# Bài tập: Session 03 - Exercise 2: DevOps Fundamentals
# Đường dẫn trên Server: /etc/nginx/sites-available/my-web
# Đường dẫn Symlink:     /etc/nginx/sites-enabled/my-web
################################################################################

server {
    # Lắng nghe trên cổng 80 cho cả IPv4 và IPv6
    listen       80;
    listen       [::]:80;

    # Nhận mọi tên miền hoặc địa chỉ IP của Droplet (catch-all)
    server_name  _;

    # Thư mục web root chính chứa mã nguồn website
    root  /var/www/my-web/html;
    index index.html index.htm;

    # --------------------------------------------------------------------------
    # Nhật ký truy cập (Access Log) và nhật ký lỗi (Error Log)
    # --------------------------------------------------------------------------
    access_log  /var/log/nginx/my-web.access.log;
    error_log   /var/log/nginx/my-web.error.log;

    # --------------------------------------------------------------------------
    # Location chính: Phục vụ các tài nguyên tĩnh
    # try_files: Kiểm tra URI file tĩnh hoặc thư mục tương ứng.
    # Nếu không tìm thấy bất kỳ file nào khớp, Nginx lập tức trả về mã lỗi 404 (=404).
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # --------------------------------------------------------------------------
    # Chỉ thị error_page 404:
    # Khi gặp mã lỗi 404 (do try_files trả về hoặc location không tồn tại),
    # Nginx sẽ tự động chuyển hướng nội bộ (internal redirect) sang URI /404.html.
    # --------------------------------------------------------------------------
    error_page 404 /404.html;

    # --------------------------------------------------------------------------
    # Khối location bảo vệ tệp tin lỗi 404.html:
    # - "root /var/www/my-web/html;": Chỉ định vị trí tệp tin nguồn 404.html trên đĩa.
    # - "internal;": Chỉ thị BẢO MẬT cốt lõi của Nginx:
    #     + CHỈ cho phép Nginx gọi nội bộ (từ error_page hoặc internal rewrite).
    #     + NGĂN CHẶN hoàn toàn người dùng bên ngoài truy cập trực tiếp bằng URL
    #       dạng http://<IP_ADDRESS_DROPLET>/404.html (Nginx sẽ phản hồi 404 Not Found).
    # --------------------------------------------------------------------------
    location = /404.html {
        root     /var/www/my-web/html;
        internal;
    }
}
